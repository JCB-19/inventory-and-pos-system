[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls","macros","bigdecimal", "time"] }
time = { version = "0.3", features = ["serde"] }
dotenvy = "0.15"
argon2 = "0.5"
rand_core = "0.10"      
base64 = "0.22"        
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
chrono = "0.4"
futures-util = "0.3"
actix-cors = "0.7.1"
